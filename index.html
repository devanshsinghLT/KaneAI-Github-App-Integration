<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login / Sign Up</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f7fb;
    }

    .container {
      width: 900px;
      min-height: 550px;
      display: flex;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .left {
      width: 50%;
      background: #4f46e5;
      color: white;
      padding: 60px 45px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .left h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .left p {
      font-size: 16px;
      line-height: 1.7;
      opacity: 0.9;
    }

    .right {
      width: 50%;
      padding: 50px 45px;
    }

    .tabs {
      display: flex;
      margin-bottom: 35px;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-weight: bold;
      color: #777;
    }

    .tab.active {
      color: #4f46e5;
      border-bottom: 2px solid #4f46e5;
    }

    h2 {
      margin-bottom: 25px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #444;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d5d7dc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #4f46e5;
    }

    .forgot {
      text-align: right;
      margin-bottom: 20px;
    }

    .forgot a {
      color: #4f46e5;
      font-size: 13px;
      text-decoration: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 25px 0;
      color: #999;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #ddd;
    }

    .google {
      background: white;
      color: #333;
      border: 1px solid #ddd;
    }

    .google:hover {
      background: #f8f8f8;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 700px) {
      .container {
        width: 95%;
      }

      .left {
        display: none;
      }

      .right {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="left">
      <h1>Welcome Back Again with Changes!</h1>
      <p>
        Sign in to continue to your account or create a new account
        to get started. abcd
      </p>
    </div>

    <div class="right">

      <div class="tabs">
        <div class="tab active" onclick="showLogin()">Login</div>
        <div class="tab" onclick="showSignup()">Sign Up</div>
      </div>

      <!-- LOGIN -->
      <div id="loginForm">

        <h2>Login</h2>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            placeholder="Enter your password"
          />
        </div>

        <div class="forgot">
          <a href="#">Forgot password?</a>
        </div>

        <button>Login</button>

        <div class="divider">OR</div>

        <button class="google">
          Continue with Google
        </button>

      </div>

      <!-- SIGN UP -->
      <div id="signupForm" class="hidden">

        <h2>Create Account</h2>

        <div class="form-group">
          <label>Full Name</label>
          <input
            type="text"
            placeholder="Enter your name"
          />
        </div>

        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input
            type="password"
            placeholder="Create a password"
          />
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <input
            type="password"
            placeholder="Confirm your password"
          />
        </div>

        <button>Sign Up</button>

        <div class="divider">OR</div>

        <button class="google">
          Sign up with Google
        </button>

      </div>

    </div>
  </div>

  <script>
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const tabs = document.querySelectorAll(".tab");

    function showLogin() {
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");

      tabs[0].classList.add("active");
      tabs[1].classList.remove("active");
    }

    function showSignup() {
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");

      tabs[1].classList.add("active");
      tabs[0].classList.remove("active");
    }
  </script>

</body>
</html>
